id: EG-3
metric_id: EG
name: Necessary Input Acquisition
name_zh: 必要输入获取完整性
definition: 截至当前任务目标适用的取证截止点，运行是否实际取得原材料中已提供、完成该目标所需的完整必要输入？
boundary: 按独立任务目标检查必要输入的获取结果，不要求已有实际行动或已回答该目标；接受预注入、后续读取及可靠等效摘要或查询，不要求读取所有文件或全部行。具体行动的证据支持归EG-1，来源版本时效归EG-2；获取结果不自动归责于Agent或平台。
inputs:
- 当前独立任务目标、适用范围及取证截止点
- 原材料及其中支持目标的必要信息、可靠等效输入的规则
- 截止点前实际可见的预注入内容、读取或查询返回及其获取顺序
- 相关获取记录的完整性和来源可用性
default_method: J
allowed_methods:
- J
instantiate_prompt: |-
  仅生成 J 检查，不生成 P 或 H。按 task/reference 中的独立目标，将完成该目标所需的信息与原材料及实际输入映射；目标即使未在答案出现也应保留。无需先穷尽全任务的必要证据清单，不以文件数、字数、行数比例或固定工具链代替语义完整性。
  criterion 明确目标、对象范围和取证截止点。默认最终交付前；仅任务或可信规则明确要求阶段完整输入交付时，才使用相应的更早截止点。初始摘录、临时使用、仅复述规则或声明信息不足，不自动构成完整输入交付点；具体行动当时证据是否充分归EG-1。初始不足但在本项截止前已补齐，应按累计取得的输入判断，不能仅凭首轮片段判否。
  绑定原材料中必要信息的定位，以及模型实际获得的输入、返回和可信顺序；评估者拥有原附件不证明被测运行已取得正文。允许预注入零工具调用，也允许覆盖目标必要信息且可核验的等效摘要、查询或聚合。摘要是否充分需结合目标语义，不要求全量读取Excel或所有附件。
  无资料依赖由可信任务条件决定不适用，不能仅因未见附件或调用就设为不适用。原材料自身缺少必要信息、日志不足或可靠等效性无法确认时保留未知。必要信息在原材料中明确存在且完整获取记录证明截止前仍未取得，才可判否。该否仅评价本次运行的获取结果，不自动判定Agent遗漏调用、平台故障或违反读取义务。
judge_rules: |-
  当前 rubric：EG-3 Necessary Input Acquisition／必要输入获取完整性。
  二元问题：截至本项取证截止点，运行是否实际取得原材料中已提供、完成当前独立目标所需的完整必要输入？
  yes：必要信息及其目标范围可确认，预注入内容或后续返回证明这些信息或可靠等效信息均在截止前取得。只要足以完成本项目标，筛选、摘要、查询和聚合均可；零读取工具调用不影响通过。
  no：原材料明确包含本项目标不可缺少的信息，完整、可核验的获取记录证明该信息及可靠等效信息直到截止仍未取得。仅有上传成功、解析ready、文件链接、总chunk数量或Agent自述“已读取全部”不能证明正文实际取得。
  unverifiable：目标必要信息或适用截止点无法确定，原材料自身缺少必要信息，实际输入/获取顺序/相关日志完整性不足，或摘要、查询的等效覆盖无法核验。没有看到记录不自动判否，不因工具未调用或答案未给出而推定输入缺失。
  按本项目标取证截止点判断。未明确规定初始完整输入时，不在首轮摘录处判否；截止前的后续补齐可以使最终检查通过。默认截止点是最终交付前，声明未知或初步复述不自动提前截止点。若另有明确的中间完整输入义务，按其范围和时点单独检查，后续补齐不改写此前独立检查。
  评估者手中的原材料与被测运行实际获得的内容必须分开。原材料覆盖全部订单不表示本轮预注入覆盖全部订单；一个目标只需要部分记录时也不要求取得其他记录。不能从最终答案正确倒推已取得输入，不能从谨慎保留未知直接推定获取失败。
  no只记录整次运行在本项目标上的获取结果；不自动将平台数据缺口归责Agent，不要求未授权或未暴露的读取工具。信息获取完整不证明行动合理或答案正确，EG-1、EG-2与TC的独立要求继续分别检查。不能将本项“目标必要输入未取得”的断言原样复制到EG-1；EG-1仍须绑定实际行动并联合判断其事前证据与支持关系，同一数据缺口可作为不同验收命题的证据。
  仅返回 status/verdict，不输出 why 或证据清单。适用性由可信配置决定，Judge不自行返回not_applicable。
programmatic_handler: null
program_contract: null
