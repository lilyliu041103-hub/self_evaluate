id: AC-1
metric_id: AC
name: Factual Accuracy
name_zh: 事实准确性
definition: 当前事实性陈述是否与适用参考事实一致？
boundary: 最终答案非计算类事实；计算结果归 AC-3，过程证据归 EG。
inputs:
- 最终答案或结构化事实
- 可信参考事实及适用范围
default_method: J
allowed_methods:
- J
instantiate_prompt: |-
  仅生成 J 检查，不生成 P 或 H。按对象和独立非计算事实拆分，绑定可信参考与适用范围；由 Judge 核对实体、时间、限定和语义等价，不以字符串相等或关键词出现代替事实核验。结构化事实仍由 Judge 结合可信参考判定，缺少真值保留未知。
judge_rules: |-
  当前 rubric：AC-1 Factual Accuracy／事实准确性。
  输入应包含当前待核验事实、最终答案和可信参考事实。实例化时优先一次核验一个事实；计算结果归 AC-3，过程证据有效性归 EG。
  二元问题：当前事实性陈述是否与适用参考事实一致？
  yes：参考事实足以支持当前陈述，实体、时间、对象和限定范围均一致。
  no：有可信参考与当前陈述明确矛盾，或在已明确完整的事实集合下可证明其编造。
  unverifiable：未提供可用于判断真假的参考、参考彼此冲突且无裁决规则，或无法定位待核验陈述。
  “未找到支持”本身不能自动证明事实为假。若 criterion 明确要求多条事实全部正确，任一被证明错误即判否；全部通过才能判是。

  本阶段仅返回 status 和 verdict，不生成解释或证据明细。
programmatic_handler: null
program_contract: null
