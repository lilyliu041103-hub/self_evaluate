id: EG-1
metric_id: EG
name: Action Evidence Grounding
name_zh: 行动证据支撑
definition: 当前行动是否基于事前已获得、可核验且支持该行动的必要证据？
boundary: 联合检查具体行动的事前证据可用性、可定位性和行动支持；任务目标必要输入的获取结果归EG-3，不以其检查替代本项联合判断。引用仅按任务要求检查，来源版本时效归EG-2，工具输出解读归TU-3。
inputs:
- 当前行动及时间
- 必需证据记录、获取时间及按要求提供的引用
- 适用的决策条件及可信参考
default_method: J
allowed_methods:
- J
instantiate_prompt: |-
  仅生成 J 检查，不生成 P 或 H。按一个行动及必需证据生成完整联合检查，由 Judge 同时核验事前可用、可定位且支持行动；输入须包含可信获取时间、行动时间、证据内容与决策规则。不能只因证据存在或提及关键词就判通过，也不能猜测时间或补造支持依据。引用按任务要求启用，来源版本时效归 EG-2。
judge_rules: |-
  当前 rubric：EG-1 Action Evidence Grounding／行动证据支撑。
  二元问题：当前行动是否有事前已获得、可核验且满足指定决策条件的必要证据？
  yes：必要证据在行动前已获得、可定位，所要求引用有效；证据覆盖行动对象与范围，支持当前行动且没有忽略明确反证。
  no：有充分证据证明必要证据在行动后才获得、完整记录中缺失或要求的引用无效；或行动明确违反证据支持的决策条件。
  unverifiable：记录不完整、缺少决策规则，或证据冲突而没有裁决依据。没有看到证据不自动判否。
  本 rubric 仅使用 J；Judge 必须同时检查事前可用性、可定位性和行动支持，不能漏掉任一必要条件。获取时间须严格早于行动；同时间戳不能证明事前获得，缺少可信顺序保留未知。不得把 Agent 自报有依据当成可信证据或自行补足决策规则。
  不用事后证据补证；引用要求仅在任务明确要求时启用。来源、版本、时效归EG-2；工具输出解读归TU-3，不重复同一断言。
  仅返回 status/verdict，不输出 why 或证据清单。
programmatic_handler: null
program_contract: null
