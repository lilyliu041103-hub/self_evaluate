id: PE-1
metric_id: PE
name: Task Decomposition
name_zh: 任务分解合理性
definition: 当前必要子目标是否在可观察计划中获得合理且可执行的安排？
boundary: 只评可观察计划；任务不要求计划且无记录时由配置设 NA，不能按最终成功倒推计划质量。
inputs:
- 可观察计划
- 必要子目标及约束
default_method: J
allowed_methods:
- J
instantiate_prompt: |-
  仅生成 J 检查，不生成 P 或 H。按必要子目标或前置准备生成计划检查，明确合理安排和可执行的条件，接受有效替代拆分；不能以关键词、固定步骤名称或列表长度代替计划质量判断。只评可观察计划；未要求展示计划时，不因没有计划记录而判失败。
judge_rules: |-
  当前 rubric：PE-1 Task Decomposition／任务分解合理性。
  输入应包含可观察计划、当前待查必要子目标及约束。上游可按必要子目标逐条实例化。
  二元问题：当前必要子目标是否在计划中获得合理且可执行的安排？
  yes：计划中存在能够落实当前子目标的步骤或合法替代方案，满足本项明确的前置条件及可执行性要求。
  no：在完整计划中可确认遗漏当前必要子目标，或所安排步骤明确不可执行、无法实现该子目标。
  unverifiable：计划记录不完整、子目标或能力约束不足以判断。
  允许不同有效拆分；不要根据实际执行成败倒推计划质量。任务不要求展示计划且没有可观察计划时，适用性由上游决定；任务要求计划但完整交付记录显示未提供，当前交付要求可判否。

  本阶段仅返回 status 和 verdict，不生成解释或证据明细。
programmatic_handler: null
program_contract: null
